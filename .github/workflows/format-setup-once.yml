name: Format Setup Once

on:
  push:
    branches:
      - main
    paths:
      - src/production/setup-v2.ts
      - src/production/setup.ts
      - src/production/config-cli.ts
      - .github/workflows/format-setup-once.yml

permissions:
  contents: write

concurrency:
  group: format-setup-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format setup files
        run: npx prettier --write src/production/setup-v2.ts src/production/setup.ts src/production/config-cli.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production/setup-v2.ts src/production/setup.ts src/production/config-cli.ts
          git commit -m "style: format guided setup"
          git push
