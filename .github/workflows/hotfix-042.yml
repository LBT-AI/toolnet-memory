name: Retry v0.4.2 Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-042.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo LBT-AI/toolnet-memory \
            --ref main \
            -f release_tag=v0.4.2
          echo 'RELEASE_v0.4.2_RETRY_DISPATCHED=YES'
