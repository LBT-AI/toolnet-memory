name: Phase 53 Memory Scope

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase53-memory-scope.yml']

permissions:
  contents: write

jobs:
  phase53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply Phase 53
        shell: bash
        run: |
          set -euo pipefail

          cat > src/memory/scope-freshness.ts <<'EOF'
          import type {
            MemoryFreshnessState,
            MemoryRecord,
            MemoryScope,
            MemoryType,
          } from '../core/types.js';

          export type MemoryLifetimeClass = 'permanent' | 'task' | 'session' | 'transient';

          const DAY_MS = 86_400_000;

          function validIso(value: unknown): string | undefined {
            if (typeof value !== 'string' || !Number.isFinite(Date.parse(value))) {
              return undefined;
            }

            return new Date(value).toISOString();
          }

          function finiteConfidence(value: unknown): number | undefined {
            if (typeof value !== 'number' || !Number.isFinite(value)) {
              return undefined;
            }

            return Math.min(1, Math.max(0, value));
          }

          function metadataRecord(value: unknown): Record<string, unknown> {
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              return {};
            }

            return value as Record<string, unknown>;
          }

          export function inferMemoryScope(kind?: string, type?: MemoryType): MemoryScope {
            switch (kind) {
              case 'rule':
                return 'rule';
              case 'decision':
              case 'architecture':
                return 'decision';
              case 'fix':
              case 'context':
                return 'fact';
              case 'todo':
              case 'next_action':
                return 'observation';
            }

            switch (type) {
              case 'rule':
                return 'rule';
              case 'decision':
                return 'decision';
              case 'todo':
              case 'activity':
              case 'summary':
                return 'observation';
              case 'code':
                return 'fact';
            }
          }

          export function inferMemoryLifetimeClass(
            kind?: string,
            type?: MemoryType
          ): MemoryLifetimeClass {
            if (kind === 'rule') {
              return 'permanent';
            }

            if (kind === 'decision' || kind === 'todo' || kind === 'next_action' || kind === 'fix') {
              return 'task';
            }

            if (kind === 'architecture') {
              return 'session';
            }

            if (kind === 'context') {
              return 'session';
            }

            if (type === 'rule') {
              return 'permanent';
            }

            if (type === 'decision' || type === 'todo') {
              return 'task';
            }

            if (type === 'activity' || type === 'summary') {
              return 'session';
            }

            return 'session';
          }

          export function defaultMemoryStaleAfter(
            lifetime: MemoryLifetimeClass,
            observedAt: string
          ): string | undefined {
            const observed = Date.parse(observedAt);

            if (!Number.isFinite(observed) || lifetime === 'permanent') {
              return undefined;
            }

            const days = lifetime === 'task' ? 30 : lifetime === 'session' ? 14 : 1;

            return new Date(observed + days * DAY_MS).toISOString();
          }

          export function candidateVerifiedAt(input: {
            observedAt: string;
            evidence?: {
              userExplicit?: boolean;
              sourceVerified?: boolean;
              testVerified?: boolean;
            };
          }): string | undefined {
            const evidence = input.evidence;

            if (
              evidence?.userExplicit === true ||
              evidence?.sourceVerified === true ||
              evidence?.testVerified === true
            ) {
              return validIso(input.observedAt);
            }

            return undefined;
          }

          export function deriveMemoryFreshness(
            memory: MemoryRecord,
            now: number = Date.now()
          ): MemoryFreshnessState {
            const metadata = metadataRecord(memory.metadata);
            const staleAfter = validIso(memory.staleAfter) ?? validIso(metadata.staleAfter);
            const expiresAt = validIso(memory.expiresAt);

            if (
              (staleAfter && Date.parse(staleAfter) <= now) ||
              (expiresAt && Date.parse(expiresAt) <= now)
            ) {
              return 'stale';
            }

            const confidence =
              finiteConfidence(memory.confidence) ?? finiteConfidence(metadata.confidence);

            if (confidence === undefined || confidence < 0.6) {
              return 'needs_verification';
            }

            const verifiedAt = validIso(memory.verifiedAt) ?? validIso(metadata.verifiedAt);

            if (!verifiedAt && confidence < 0.9) {
              return 'needs_verification';
            }

            return 'fresh';
          }

          export function normalizeMemoryScopeMetadata(memory: MemoryRecord): boolean {
            const metadata = metadataRecord(memory.metadata);
            const learningKind =
              typeof metadata.learningKind === 'string' ? metadata.learningKind : undefined;
            const currentScope =
              typeof memory.scope === 'string'
                ? memory.scope
                : typeof metadata.memoryScope === 'string'
                  ? (metadata.memoryScope as MemoryScope)
                  : undefined;
            const scope = currentScope ?? inferMemoryScope(learningKind, memory.type);
            const observedAt =
              validIso(memory.observedAt) ??
              validIso(metadata.observedAt) ??
              validIso(metadata.sourceCreatedAt) ??
              validIso(memory.createdAt) ??
              new Date(0).toISOString();
            const confidence =
              finiteConfidence(memory.confidence) ?? finiteConfidence(metadata.confidence);
            const evidence = metadataRecord(metadata.evidence);
            const verifiedAt =
              validIso(memory.verifiedAt) ??
              validIso(metadata.verifiedAt) ??
              candidateVerifiedAt({
                observedAt,
                evidence: {
                  userExplicit: evidence.userExplicit === true,
                  sourceVerified: evidence.sourceVerified === true,
                  testVerified: evidence.testVerified === true,
                },
              });
            const rawLifetime = metadata.knowledgeClass;
            const lifetime: MemoryLifetimeClass =
              rawLifetime === 'permanent' ||
              rawLifetime === 'task' ||
              rawLifetime === 'session' ||
              rawLifetime === 'transient'
                ? rawLifetime
                : inferMemoryLifetimeClass(learningKind, memory.type);
            const staleAfter =
              validIso(memory.staleAfter) ??
              validIso(metadata.staleAfter) ??
              defaultMemoryStaleAfter(lifetime, observedAt);
            const provenance = metadataRecord(metadata.provenance);
            const sourcePaths = Array.isArray(provenance.sourcePaths) ? provenance.sourcePaths : [];
            const sourceRef =
              memory.sourceRef ??
              (typeof metadata.sourceRef === 'string' ? metadata.sourceRef : undefined) ??
              sourcePaths.find((value): value is string => typeof value === 'string');

            const nextMetadata: Record<string, unknown> = {
              ...metadata,
              memoryScope: scope,
              observedAt,
              confidence,
              knowledgeClass: lifetime,
              freshnessSchema: 1,
            };

            if (verifiedAt) {
              nextMetadata.verifiedAt = verifiedAt;
            }

            if (staleAfter) {
              nextMetadata.staleAfter = staleAfter;
            }

            if (sourceRef) {
              nextMetadata.sourceRef = sourceRef;
            }

            const before = JSON.stringify({
              scope: memory.scope,
              observedAt: memory.observedAt,
              verifiedAt: memory.verifiedAt,
              confidence: memory.confidence,
              staleAfter: memory.staleAfter,
              sourceRef: memory.sourceRef,
              metadata: memory.metadata,
            });

            memory.scope = scope;
            memory.observedAt = observedAt;
            memory.confidence = confidence;
            memory.verifiedAt = verifiedAt;
            memory.staleAfter = staleAfter;
            memory.sourceRef = sourceRef;
            memory.metadata = nextMetadata;

            return (
              before !==
              JSON.stringify({
                scope: memory.scope,
                observedAt: memory.observedAt,
                verifiedAt: memory.verifiedAt,
                confidence: memory.confidence,
                staleAfter: memory.staleAfter,
                sourceRef: memory.sourceRef,
                metadata: memory.metadata,
              })
            );
          }
          EOF

          cat > tests/memory/phase53-scope-freshness.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import type { MemoryRecord } from '../../src/core/types.js';
          import {
            defaultMemoryStaleAfter,
            deriveMemoryFreshness,
            inferMemoryScope,
            normalizeMemoryScopeMetadata,
          } from '../../src/memory/scope-freshness.js';

          function legacyMemory(overrides: Partial<MemoryRecord> = {}): MemoryRecord {
            return {
              id: 'memory-1',
              projectId: 'project-1',
              type: 'todo',
              content: 'Deploy production after verification.',
              importance: 'normal',
              importanceScore: 50,
              tags: ['todo'],
              source: 'session-memory-learner',
              createdAt: '2026-09-01T00:00:00.000Z',
              updatedAt: '2026-09-01T00:00:00.000Z',
              metadata: {
                learningKind: 'todo',
                confidence: 0.87,
                sourceCreatedAt: '2026-09-01T00:00:00.000Z',
                evidence: {
                  userExplicit: true,
                  sourceVerified: false,
                  testVerified: false,
                },
              },
              ...overrides,
            };
          }

          describe('Phase 53 memory scope and freshness', () => {
            it('separates semantic scope from lifetime and derives stale time', () => {
              expect(inferMemoryScope('rule', 'rule')).toBe('rule');
              expect(inferMemoryScope('decision', 'decision')).toBe('decision');
              expect(inferMemoryScope('fix', 'code')).toBe('fact');
              expect(inferMemoryScope('todo', 'todo')).toBe('observation');

              expect(defaultMemoryStaleAfter('permanent', '2026-09-01T00:00:00.000Z')).toBeUndefined();
              expect(defaultMemoryStaleAfter('task', '2026-09-01T00:00:00.000Z')).toBe(
                '2026-10-01T00:00:00.000Z'
              );
            });

            it('backfills legacy memories without changing lifecycle state', () => {
              const memory = legacyMemory();
              const changed = normalizeMemoryScopeMetadata(memory);

              expect(changed).toBe(true);
              expect(memory.scope).toBe('observation');
              expect(memory.observedAt).toBe('2026-09-01T00:00:00.000Z');
              expect(memory.verifiedAt).toBe('2026-09-01T00:00:00.000Z');
              expect(memory.confidence).toBe(0.87);
              expect(memory.staleAfter).toBe('2026-10-01T00:00:00.000Z');
              expect(memory.metadata?.freshnessSchema).toBe(1);
              expect(memory.metadata?.lifecycleState).toBeUndefined();
            });

            it('marks freshness as derived state and never mutates the memory', () => {
              const memory = legacyMemory({
                scope: 'observation',
                observedAt: '2026-09-01T00:00:00.000Z',
                verifiedAt: '2026-09-01T00:00:00.000Z',
                confidence: 0.87,
                staleAfter: '2026-09-02T00:00:00.000Z',
              });
              const before = JSON.stringify(memory);

              expect(deriveMemoryFreshness(memory, Date.parse('2026-09-03T00:00:00.000Z'))).toBe(
                'stale'
              );
              expect(JSON.stringify(memory)).toBe(before);
            });

            it('requires verification for weak or unverified observations', () => {
              expect(
                deriveMemoryFreshness(
                  legacyMemory({
                    confidence: 0.55,
                    staleAfter: '2026-12-01T00:00:00.000Z',
                  }),
                  Date.parse('2026-09-03T00:00:00.000Z')
                )
              ).toBe('needs_verification');
            });
          });
          EOF

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/core/types.ts',
              "export type MemoryType = 'code' | 'activity' | 'decision' | 'rule' | 'todo' | 'summary';\n\nexport type ImportanceLevel",
              "export type MemoryType = 'code' | 'activity' | 'decision' | 'rule' | 'todo' | 'summary';\n\nexport type MemoryScope = 'rule' | 'decision' | 'fact' | 'observation' | 'history';\n\nexport type MemoryFreshnessState = 'fresh' | 'needs_verification' | 'stale';\n\nexport type ImportanceLevel",
          )
          replace_once(
              'src/core/types.ts',
              "  content: string;\n\n  importance: ImportanceLevel;",
              "  content: string;\n\n  /** Semantic meaning of this note. Optional for legacy records. */\n  scope?: MemoryScope;\n  /** When the underlying fact/rule/work observation was observed. */\n  observedAt?: string;\n  /** Last time the note was explicitly/source/test verified. */\n  verifiedAt?: string;\n  /** Canonical confidence in the note, normalized to 0..1. */\n  confidence?: number;\n  /** Freshness boundary. Expiry and lifecycle remain separate concerns. */\n  staleAfter?: string;\n  /** Path/event/artifact reference supporting this note when available. */\n  sourceRef?: string;\n\n  importance: ImportanceLevel;",
          )

          replace_once(
              'src/session/learner/types.ts',
              "import type { ImportanceLevel, MemoryType } from '../../core/types.js';",
              "import type { ImportanceLevel, MemoryScope, MemoryType } from '../../core/types.js';",
          )
          replace_once(
              'src/session/learner/types.ts',
              "  content: string;\n\n  confidence: number;",
              "  content: string;\n\n  /** Phase 53 fields are optional so immutable v1 journal batches remain readable. */\n  scope?: MemoryScope;\n\n  observedAt?: string;\n\n  verifiedAt?: string;\n\n  staleAfter?: string;\n\n  sourceRef?: string;\n\n  knowledgeClass?: 'permanent' | 'task' | 'session' | 'transient';\n\n  confidence: number;",
          )

          replace_once(
              'src/memory/pipeline-v2.ts',
              "import { evaluateMemoryPromotion, type MemoryKnowledgeClass } from './promotion-policy.js';\n",
              "import { evaluateMemoryPromotion, type MemoryKnowledgeClass } from './promotion-policy.js';\nimport {\n  candidateVerifiedAt,\n  defaultMemoryStaleAfter,\n  inferMemoryScope,\n} from './scope-freshness.js';\n\nimport type { MemoryScope } from '../core/types.js';\n",
          )
          replace_once(
              'src/memory/pipeline-v2.ts',
              "export interface MemoryPipelineCandidate extends LearnedMemoryCandidate {\n  knowledgeClass: MemoryKnowledgeClass;\n\n  importanceScore: number;",
              "export interface MemoryPipelineCandidate extends LearnedMemoryCandidate {\n  knowledgeClass: MemoryKnowledgeClass;\n\n  scope: MemoryScope;\n\n  observedAt: string;\n\n  importanceScore: number;",
          )
          replace_once(
              'src/memory/pipeline-v2.ts',
              "  knowledgeClass: MemoryKnowledgeClass;\n\n  importanceScore: number;\n\n  content: string;",
              "  knowledgeClass: MemoryKnowledgeClass;\n\n  scope: MemoryScope;\n\n  importanceScore: number;\n\n  content: string;",
          )

          old_enrich = '''function enrichCandidate(candidate: LearnedMemoryCandidate): MemoryPipelineCandidate {\n  const evaluation = evaluateMemoryPromotion(candidate);\n\n  return {\n    ...candidate,\n\n    knowledgeClass: evaluation.knowledgeClass,\n\n    importanceScore: evaluation.score,\n\n    retrievalTerms: retrievalTerms(candidate.content),\n\n    tags: uniqueStrings([\n      ...candidate.tags,\n      'level:fact',\n      `class:${evaluation.knowledgeClass}`,\n      `kind:${candidate.kind}`,\n    ]),\n  };\n}\n'''
          new_enrich = '''function enrichCandidate(candidate: LearnedMemoryCandidate): MemoryPipelineCandidate {\n  const evaluation = evaluateMemoryPromotion(candidate);\n\n  const scope = inferMemoryScope(candidate.kind, candidate.type);\n\n  const observedAt = candidate.observedAt ?? candidate.createdAt;\n\n  const verifiedAt =\n    candidate.verifiedAt ??\n    candidateVerifiedAt({\n      observedAt,\n      evidence: candidate.evidence,\n    });\n\n  const staleAfter =\n    candidate.staleAfter ?? defaultMemoryStaleAfter(evaluation.knowledgeClass, observedAt);\n\n  const sourceRef =\n    candidate.sourceRef ?? candidate.provenance.sourcePaths[0] ?? candidate.provenance.sourceEventIds[0];\n\n  return {\n    ...candidate,\n\n    knowledgeClass: evaluation.knowledgeClass,\n\n    scope,\n\n    observedAt,\n\n    verifiedAt,\n\n    staleAfter,\n\n    sourceRef,\n\n    importanceScore: evaluation.score,\n\n    retrievalTerms: retrievalTerms(candidate.content),\n\n    tags: uniqueStrings([\n      ...candidate.tags,\n      'level:fact',\n      `class:${evaluation.knowledgeClass}`,\n      `scope:${scope}`,\n      `kind:${candidate.kind}`,\n    ]),\n  };\n}\n'''
          replace_once('src/memory/pipeline-v2.ts', old_enrich, new_enrich)
          replace_once(
              'src/memory/pipeline-v2.ts',
              "    knowledgeClass: candidate.knowledgeClass,\n\n    importanceScore: candidate.importanceScore,",
              "    knowledgeClass: candidate.knowledgeClass,\n\n    scope: candidate.scope,\n\n    importanceScore: candidate.importanceScore,",
          )

          replace_once(
              'src/session/learner/journal.ts',
              "import { safeAppendAuditEvent } from '../../audit/log.js';\n",
              "import { safeAppendAuditEvent } from '../../audit/log.js';\nimport { normalizeMemoryScopeMetadata } from '../../memory/scope-freshness.js';\n",
          )
          replace_once(
              'src/session/learner/journal.ts',
              "  const existing = await store.load(project.id);\n\n  const engine = new MemoryEngine();\n\n  engine.importRecords(existing);",
              "  const existing = await store.load(project.id);\n\n  let phase53Backfilled = 0;\n\n  for (const memory of existing) {\n    phase53Backfilled += normalizeMemoryScopeMetadata(memory) ? 1 : 0;\n  }\n\n  const engine = new MemoryEngine();\n\n  engine.importRecords(existing);",
          )
          replace_once(
              'src/session/learner/journal.ts',
              "        evidenceUpdated += memory && mergeConfirmationEvidence(memory, candidate) ? 1 : 0;\n\n        continue;",
              "        const evidenceChanged = memory ? mergeConfirmationEvidence(memory, candidate) : false;\n        const phase53Changed = memory ? normalizeMemoryScopeMetadata(memory) : false;\n\n        evidenceUpdated += evidenceChanged || phase53Changed ? 1 : 0;\n\n        continue;",
          )
          replace_once(
              'src/session/learner/journal.ts',
              "          sourceCreatedAt: candidate.createdAt,\n          sessionKey: candidate.sessionKey,",
              "          sourceCreatedAt: candidate.createdAt,\n          memoryScope: candidate.scope,\n          knowledgeClass: candidate.knowledgeClass,\n          observedAt: candidate.observedAt ?? candidate.createdAt,\n          verifiedAt: candidate.verifiedAt,\n          staleAfter: candidate.staleAfter,\n          sourceRef: candidate.sourceRef,\n          sessionKey: candidate.sessionKey,",
          )
          replace_once(
              'src/session/learner/journal.ts',
              "      fingerprints.add(candidate.fingerprint);",
              "      normalizeMemoryScopeMetadata(remembered);\n\n      fingerprints.add(candidate.fingerprint);",
          )
          replace_once(
              'src/session/learner/journal.ts',
              "  if (added > 0 || evidenceUpdated > 0) {",
              "  if (added > 0 || evidenceUpdated > 0 || phase53Backfilled > 0) {",
          )

          replace_once(
              'tests/memory/pipeline-v2.test.ts',
              "    expect(result.candidates.some((candidate) => candidate.tags.includes('class:permanent'))).toBe(\n      true\n    );\n",
              "    expect(result.candidates.some((candidate) => candidate.tags.includes('class:permanent'))).toBe(\n      true\n    );\n\n    expect(result.candidates.every((candidate) => Boolean(candidate.scope))).toBe(true);\n    expect(result.candidates.every((candidate) => Boolean(candidate.observedAt))).toBe(true);\n    expect(result.retrievalIndex.every((entry) => Boolean(entry.scope))).toBe(true);\n    expect(\n      result.candidates.find((candidate) => candidate.knowledgeClass === 'permanent')?.staleAfter\n    ).toBeUndefined();\n    expect(\n      result.candidates.find((candidate) => candidate.knowledgeClass === 'task')?.staleAfter\n    ).toBeTruthy();\n",
          )

          replace_once(
              'tests/session/session-memory-learner.test.ts',
              "    expect(memories[0].metadata?.learningFingerprint).toBeTruthy();\n",
              "    expect(memories[0].metadata?.learningFingerprint).toBeTruthy();\n\n    expect(memories[0].scope).toBe('rule');\n    expect(memories[0].confidence).toBeGreaterThanOrEqual(0.9);\n    expect(memories[0].observedAt).toBeTruthy();\n    expect(memories[0].verifiedAt).toBeTruthy();\n    expect(memories[0].staleAfter).toBeUndefined();\n    expect(memories[0].metadata?.freshnessSchema).toBe(1);\n",
          )
          PY

          npx prettier --write \
            src/core/types.ts \
            src/memory/scope-freshness.ts \
            src/memory/pipeline-v2.ts \
            src/session/learner/types.ts \
            src/session/learner/journal.ts \
            tests/memory/phase53-scope-freshness.test.ts \
            tests/memory/pipeline-v2.test.ts \
            tests/session/session-memory-learner.test.ts

      - name: Certify Phase 53
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run \
            tests/memory/phase53-scope-freshness.test.ts \
            tests/memory/pipeline-v2.test.ts \
            tests/session/session-memory-learner.test.ts
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          git diff --check

      - name: Commit Phase 53
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase53-memory-scope.yml
          git add -A
          git commit -m 'feat: phase 53 memory scope and freshness model'
          git push origin HEAD:main
          echo 'PHASE53_MEMORY_SCOPE=PASS'
