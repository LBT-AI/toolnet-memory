name: Phase 67 Publish v0.5.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase67-publish-v053.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.5.3
      TAG: v0.5.3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 67 and release target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 70b9a07 HEAD
          test -f src/recovery/disaster-recovery.ts
          test -f src/production/disaster-recovery-certify.ts
          if npm view "toolnet-memory@$VERSION" version >/dev/null 2>&1; then
            echo "toolnet-memory@$VERSION already exists on npm"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 1
          fi

      - name: Prepare v0.5.3 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          printf '%s\n' "$VERSION" > .release-target
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;

          const manifestPath = 'release-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = version;
          manifest.releaseSeries = '0.5.x';
          manifest.hardening = manifest.hardening || {};
          manifest.hardening.disasterRecovery = {
            phase67: true,
            authoritativeLocalBackup: true,
            remoteNamespaceBackup: true,
            sha256Integrity: true,
            mandatorySafetyBackup: true,
            taskProjectionRebuild: true,
            sessionWalRecovery: true,
            sharedJournalRebuild: true,
            adaptiveRecertification: true,
            remoteRestoreAdditive: true,
            remoteDeleteDuringRestore: false,
            productionReleaseBlocking: true
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(/Current release: \*\*v\d+\.\d+\.\d+\*\*/, `Current release: **v${version}**`);
          if (!readme.includes('### v0.5.3 Disaster Recovery')) {
            const section = `### v0.5.3 Disaster Recovery\n\n- Adds Phase 67 backup, restore, and disaster-recovery certification.\n- Backs up authoritative Task operations, per-source Session WALs, retrieval advisory state, and the complete remote project namespace.\n- Adds SHA-256 integrity verification for every backup object plus the recovery manifest.\n- Restore is dry-run by default and always creates a pre-restore safety backup before apply.\n- Rebuilds Task projection and shared Session journal from authoritative logs.\n- Remote restore is additive and never deletes newer immutable operations.\n- Production certification now includes the Phase 67 disaster-recovery gate.\n\n`;
            const marker = '## Supported Coding Agents';
            if (!readme.includes(marker)) throw new Error('README insertion marker missing');
            readme = readme.replace(marker, section + marker);
          }
          fs.writeFileSync(readmePath, readme);
          NODE
          npx prettier --write package.json package-lock.json release-manifest.json README.md

      - name: Certify v0.5.3
        shell: bash
        run: |
          set -euo pipefail
          npm run phase67:certify
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build:release
          node bundle/production-certify.js

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- bundle 2>/dev/null || true
          git clean -fd -- bundle 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json release-manifest.json .release-target README.md
          git diff --cached --check
          git commit -m 'chore: prepare toolnet memory v0.5.3 release'
          git push origin main

      - name: Create annotated v0.5.3 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m 'ToolNet Memory v0.5.3 — Disaster Recovery'
          git push origin "$TAG"

      - name: Dispatch canonical release workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --ref main -f release_tag="$TAG"
          RUN_ID=''
          for i in $(seq 1 30); do
            CANDIDATE="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != '0' ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Canonical release workflow run: $RUN_ID"

      - name: Wait for canonical release
        shell: bash
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --exit-status --interval 10

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view "toolnet-memory@$VERSION" version)" = "$VERSION"
          test "$(npm view toolnet-memory dist-tags.latest)" = "$VERSION"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,publishedAt

      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase67-publish-v053.yml
          git commit -m 'chore: remove one-shot v0.5.3 publisher'
          git push origin main
