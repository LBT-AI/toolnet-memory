name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish npm + GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate installer
        run: bash -n scripts/install.sh

      - name: Run tests
        run: npm test

      - name: Build production release
        run: npm run build:release

      - name: Pack release artifact
        shell: bash
        run: |
          TARBALL="$(npm pack --silent)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          test -f "$TARBALL"

      - name: Check npm release
        id: npm_release
        shell: bash
        run: |
          if npm view "toolnet-memory@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "toolnet-memory@$VERSION already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing
        if: steps.npm_release.outputs.exists != 'true'
        run: npm publish --access public

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --title "ToolNet Memory $GITHUB_REF_NAME" \
            --generate-notes
